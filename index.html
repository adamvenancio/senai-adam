<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de CEP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
    body {
      
        background-image: url('https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=1920') !important;
        background-size: cover;
        background-position: center; 
        background-attachment: fixed; 
        background-repeat: no-repeat;
    }


    .clima-box {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1050;
        min-width: 220px;
        background-color: rgba(255, 255, 255, 0.95);
        border-left: 5px solid #ff8c00;
        transition: all 0.3s ease;
    }

    .form-control:placeholder-shown,
    .form-select:invalid, 
    select.bg-body-secondary option[value=""] { 
        background-color: #ffe6cc !important; 
    }

    .form-control:not(:placeholder-shown),
    .form-control-preenchido {
        background-color: #ffffff !important;
    }
</style>
</head>
<body class="bg-light">

    <div id="climaCard" class="card shadow-sm clima-box d-none">
        <div class="card-body p-3">
            <h6 class="card-title text-muted small fw-bold mb-1">Clima Atual</h6>
            <div class="d-flex align-items-center justify-content-between">
                <div>
                    <h4 class="mb-0 fw-bold text-dark" id="climaTemp">--°C</h4>
                    <small class="text-secondary" id="climaCidade">--</small>
                </div>
                <div class="fs-1" id="climaIcone">☀️</div>
            </div>
            <div class="text-muted small mt-1" id="climaCondicao">Buscando...</div>
        </div>
    </div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <div class="card shadow-sm">
                    <div class="card-header text-white text-center py-3" style="background-color: #ff8c00;">
                        <h4 class="mb-0 fw-bold">Buscador de Endereço</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <div class="mb-4">
                            <label for="myInput" class="form-label fw-bold">Digite o CEP</label>
                            <div class="input-group">
                                <input type="text" id="myInput" class="form-control" placeholder="Ex: 01001000" maxlength="8">
                                <button class="btn text-white fw-bold" type="button" onclick="myFunction()" style="background-color: #ff8c00;">
                                    <span class="align-middle">Buscar</span>
                                </button>
                            </div>
                            <div class="form-text">Apenas números, sem hífen ou pontos.</div>
                        </div>

                        <hr class="my-4">

                        <h5 class="card-title mb-3 text-secondary">Resultado da Consulta</h5>
                        
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Logradouro / Rua</label>
                            <input type="text" id="rua" class="form-control" readonly placeholder="Rua...">
                        </div>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted small fw-bold">Bairro</label>
                                <input type="text" id="bairro" class="form-control" readonly placeholder="Bairro...">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted small fw-bold">Cidade</label>
                                <input type="text" id="cidade" class="form-control" readonly placeholder="Cidade...">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Estado (UF)</label>
                            <select id="estado" class="form-select" required style="pointer-events: none; touch-action: none;">
                                <option value="" selected disabled hidden>Selecione o estado...</option>
                                <option value="AC">Acre</option>
                                <option value="AL">Alagoas</option>
                                <option value="AP">Amapá</option>
                                <option value="AM">Amazonas</option>
                                <option value="BA">Bahia</option>
                                <option value="CE">Ceará</option>
                                <option value="DF">Distrito Federal</option>
                                <option value="ES">Espírito Santo</option>
                                <option value="GO">Goiás</option>
                                <option value="MA">Maranhão</option>
                                <option value="MT">Mato Grosso</option>
                                <option value="MS">Mato Grosso do Sul</option>
                                <option value="MG">Minas Gerais</option>
                                <option value="PA">Pará</option>
                                <option value="PB">Paraíba</option>
                                <option value="PR">Paraná</option>
                                <option value="PE">Pernambuco</option>
                                <option value="PI">Piauí</option>
                                <option value="RJ">Rio de Janeiro</option>
                                <option value="RN">Rio Grande do Norte</option>
                                <option value="RS">Rio Grande do Sul</option>
                                <option value="RO">Rondônia</option>
                                <option value="RR">Roraima</option>
                                <option value="SC">Santa Catarina</option>
                                <option value="SP">São Paulo</option>
                                <option value="SE">Sergipe</option>
                                <option value="TO">Tocantins</option>
                            </select>
                        </div>

                        <div class="mb-0">
                            <label class="form-label text-muted small fw-bold">Resumo Completo</label>
                            <textarea id="resumo" class="form-control" rows="2" readonly placeholder="As informações consolidadas aparecerão aqui..."></textarea>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        function interpretarWMO(codigo) {
            const tabela = {
                0: { texto: "Céu limpo", icone: "☀️" },
                1: { texto: "Principalmente limpo", icone: "🌤️" },
                2: { texto: "Parcialmente nublado", icone: "⛅" },
                3: { texto: "Encoberto", icone: "☁️" },
                45: { texto: "Névoa", icone: "🌫️" },
                48: { texto: "Névoa com geada", icone: "🌫️" },
                51: { texto: "Chuva leve", icone: "🌧️" },
                53: { texto: "Chuva moderada", icone: "🌧️" },
                55: { texto: "Chuva densa", icone: "🌧️" },
                61: { texto: "Chuva fraca", icone: "🌧️" },
                63: { texto: "Chuva moderada", icone: "🌧️" },
                65: { texto: "Chuva forte", icone: "🌧️" },
                71: { texto: "Neve leve", icone: "❄️" },
                73: { texto: "Neve moderada", icone: "❄️" },
                75: { texto: "Neve forte", icone: "❄️" },
                77: { texto: "Granizo", icone: "🌨️" },
                80: { texto: "Pancadas de chuva leves", icone: "🌦️" },
                81: { texto: "Pancadas de chuva moderadas", icone: "🌦️" },
                82: { texto: "Pancadas de chuva violentas", icone: "⛈️" },
                95: { texto: "Trovoada leve/moderada", icone: "⛈️" },
                96: { texto: "Trovoada com granizo leve", icone: "⛈️" },
                99: { texto: "Trovoada com granizo forte", icone: "⛈️" }
            };
            return tabela[codigo] || { texto: "Desconhecido", icone: "🌍" };
        }

        async function buscarClima(cidade, uf) {
            try {
              
                const geoUrl = `https://nominatim.openstreetmap.org/search?city=${encodeURIComponent(cidade)}&state=${encodeURIComponent(uf)}&country=Brazil&format=json&limit=1`;
                const geoResponse = await fetch(geoUrl);
                const geoData = await geoResponse.json();

                if (!geoData || geoData.length === 0) return;

                const lat = geoData[0].lat;
                const lon = geoData[0].lon;

               
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
                const weatherResponse = await fetch(weatherUrl);
                const weatherData = await weatherResponse.json();

                if (weatherData && weatherData.current_weather) {
                    const temp = Math.round(weatherData.current_weather.temperature);
                    const infoClima = interpretarWMO(weatherData.current_weather.weathercode);

                   
                    document.getElementById("climaTemp").innerText = `${temp}°C`;
                    document.getElementById("climaCidade").innerText = `${cidade} - ${uf}`;
                    document.getElementById("climaCondicao").innerText = infoClima.texto;
                    document.getElementById("climaIcone").innerText = infoClima.icone;
                    
                   
                    document.getElementById("climaCard").classList.remove("d-none");
                }
            } catch (err) {
                console.error("Erro ao buscar o clima:", err);
            }
        }

        async function myFunction() {
            let cep = document.getElementById("myInput").value;
            
            if (!cep) {
                alert("Por favor, digite um CEP.");
                return;
            }

            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();

                if (data.erro) {
                    alert("CEP não encontrado.");
                    return;
                }

                const txtRua = document.getElementById("rua");
                const txtBairro = document.getElementById("bairro");
                const txtCidade = document.getElementById("cidade");
                const selectEstado = document.getElementById("estado");
                const txtResumo = document.getElementById("resumo");

                txtRua.value = data.logradouro || "Não informado";
                txtBairro.value = data.bairro || "Não informado";
                txtCidade.value = data.localidade;
                selectEstado.value = data.uf;
                txtResumo.value = `CEP: ${data.cep} | Localidade: ${data.localidade}-${data.uf}`;
                
                selectEstado.classList.add("form-control-preenchido");
                txtResumo.classList.add("form-control-preenchido");
                
                buscarClima(data.localidade, data.uf);
                
            } catch (error) {
                console.error("Erro ao buscar o CEP:", error);
                alert("Erro ao consultar o serviço de CEP.");
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
